; ---------------------------------------------------------------------------
; Screen test — a separate, throwaway project.
;
; It uses a different graphics library (LovyanGFX) from the display project,
; and does nothing but fill the screen with colours. Its whole purpose is to
; answer one question: does this panel work at all on this chip?
;
;   pio run -e esp32s3 --target upload --upload-port COM9
; ---------------------------------------------------------------------------

[platformio]
src_dir = src
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@7.0.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

lib_deps =
    lovyan03/LovyanGFX@^1.1.16

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
