[platformio]
src_dir = main
build_dir = .pio/build
workspace_dir = .pio

; ---------------------------------------------------------------------------
; Two build profiles for the same transmitter code.
;
;   esp32dev - classic ESP32-WROOM-32. The original, and the eventual board.
;   esp32s3  - ESP32-S3. Used while a second WROOM is not available.
;
; The transmitter uses no pins beyond power, and does no CSI work, so the
; chip it runs on does not affect the readings' format or any of the Python
; tools. It DOES affect the readings themselves — the transmitter's radio is
; part of what the receiver measures — so data collected with one is not
; interchangeable with data collected with the other.
;
;   pio run -e esp32dev --target upload
;   pio run -e esp32s3  --target upload
; ---------------------------------------------------------------------------

[env:esp32dev]
platform = espressif32@7.0.0
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters = direct

[env:esp32s3]
platform = espressif32@7.0.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = direct

; N16R8 means 16MB of storage and 8MB of extra memory, wired in octal mode.
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    ; Serial goes over the board's native USB socket. If the monitor shows
    ; nothing, try the other USB socket, or set this to 0.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
