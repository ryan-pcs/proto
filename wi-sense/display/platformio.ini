; ---------------------------------------------------------------------------
; Two build profiles, one program.
;
;   esp32s3  - ESP32-S3 N16R8. The bench board, for developing the screens.
;   esp32dev - classic ESP32-WROOM-32. The board that becomes the receiver.
;
; The two chips number their pins differently, so each profile carries its own
; screen pins. Nothing in src/ changes between them.
;
;   pio run -e esp32s3  --target upload      (bench board)
;   pio run -e esp32dev --target upload      (receiver board)
; ---------------------------------------------------------------------------

[platformio]
src_dir = src
default_envs = esp32s3

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    ; use the settings here instead of the library's own setup file
    -DUSER_SETUP_LOADED=1

    ; the 4.0" 480x320 board's controller
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480

    ; fonts
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; the touch panel must be talked to slowly; the screen can go fast
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; ---------------------------------------------------------------------------
; Bench board: ESP32-S3 N16R8
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32@7.0.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
upload_speed = 921600

; N16R8 means 16MB of storage and 8MB of extra memory, wired in octal mode.
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    ${common.build_flags}
    -DBOARD_S3=1

    ; Serial output goes over the board's native USB socket. If you see no
    ; serial output, try the other USB socket, or set this to 0.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; screen pins for the S3 — see docs/wiring-pin-map.md, bench section
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=9
    -DTOUCH_CS=15

; ---------------------------------------------------------------------------
; Receiver board: classic ESP32-WROOM-32
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@7.0.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
upload_speed = 460800

build_flags =
    ${common.build_flags}

    ; screen pins for the classic board — see docs/wiring-pin-map.md
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=33
    -DTFT_DC=25
    -DTFT_RST=26
    -DTOUCH_CS=4
