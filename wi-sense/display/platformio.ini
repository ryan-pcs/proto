; ---------------------------------------------------------------------------
; Two build profiles, one program.
;
;   esp32s3  - ESP32-S3 N16R8
;   esp32dev - classic ESP32-WROOM-32
;
; The two chips number their pins differently. Those tables now live in
; src/board_pins.h rather than here, because the graphics library is told
; its pins in code rather than at build time.
;
;   pio run -e esp32s3  --target upload
;   pio run -e esp32dev --target upload
; ---------------------------------------------------------------------------

[platformio]
src_dir = src
default_envs = esp32s3

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@^1.1.16

; ---------------------------------------------------------------------------
; ESP32-S3 N16R8
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32@7.0.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
upload_speed = 921600

; Turns a crash dump into readable function names instead of addresses.
monitor_filters = esp32_exception_decoder

; N16R8 means 16MB of storage and 8MB of extra memory, wired in octal mode.
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_S3=1

    ; Serial goes over the board's own USB socket. If the monitor shows
    ; nothing, try the other socket, or set this to 0.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; Stage A: set to 1 to also run the CSI capture and answer the laptop's
    ; collect_burst.py, so the readings coming out of this chip can be
    ; compared against ones from the classic ESP32. The screens are unaffected
    ; either way. See the note at the top of src/main.cpp.
    ;
    ; Note the capture prints through Arduino's Serial, not ets_printf, so the
    ; readings come out of the same USB socket as everything else this program
    ; says - which is why CDC above does not have to be turned off.
    -DCSI_STAGE_A=1

; ---------------------------------------------------------------------------
; classic ESP32-WROOM-32
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@7.0.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
upload_speed = 460800
